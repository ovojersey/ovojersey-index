<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="index, follow">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ovojersey Category Index Home</title>
<meta name="description" content="Browse all national team and club football jersey category links for Ovojersey. Find football kits for every national and club side.">
<style>
:root{--bg:#f8f9fa;--card:#fff;--text:#1a202c;--text2:#4a5568;--border:#e2e8f0;--accent:#0058cc;--accent-light:#ebf4ff;}
[data-theme="dark"]{--bg:#1a1a1a;--card:#242424;--text:#e2e8f0;--text2:#a0aec0;--border:#2d3748;--accent:#63b3ed;--accent-light:#1a365d;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);max-width:1100px;margin:0 auto;padding:48px 20px;line-height:1.7;}
h1{font-size:30px;margin-bottom:12px;}
.desc{color:var(--text2);margin-bottom:36px;font-size:16px;max-width:700px;}
.nav-block{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.nav-item{display:block;padding:14px 18px;border:1px solid var(--border);border-radius:8px;background:var(--card);text-decoration:none;color:var(--text);font-size:15px;transition:0.15s;}
.nav-item:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-light);transform:translateY(-2px);}
.theme-btn{position:fixed;top:16px;right:16px;padding:8px 14px;border:1px solid var(--border);border-radius:8px;background:var(--card);color:var(--text);cursor:pointer;font-size:13px;z-index:100;}
.theme-btn:hover{border-color:var(--accent);}
footer{margin-top:60px;color:var(--text2);font-size:13px;}
</style>
</head>
<body>
<button class="theme-btn" onclick="toggleTheme()">🌙 Dark</button>

<h1>Ovojersey Category Index</h1>
<p class="desc">Quick access to all national‑team and club football jersey category pages. Click to open index listing page.</p>

<div class="nav-block">
    <a href="page1.html" class="nav-item">Page 1 — Europe National Teams</a>
    <!--后续生成page2‑page16之后，在这里继续添加，示例：
    <a href="page2.html" class="nav-item">Page 2 — South America National Teams</a>
    -->
</div>

<footer>Static category index for Ovojersey</footer>

<script>
let dark=localStorage.getItem('darkMode')==='1';
function applyTheme(){
  if(dark){
    document.documentElement.setAttribute('data-theme','dark');
    document.querySelector('.theme-btn').textContent='☀️ Light';
  }else{
    document.documentElement.removeAttribute('data-theme');
    document.querySelector('.theme-btn').textContent='🌙 Dark';
  }
}
applyTheme();
function toggleTheme(){
  dark=!dark;
  localStorage.setItem('darkMode',dark?'1':'0');
  applyTheme();
}
</script>
</body>
</html>
